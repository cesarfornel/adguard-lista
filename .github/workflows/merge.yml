name: Atualizar lista mesclada

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 06:17 UTC (02:17 em Cuiabá)
  workflow_dispatch: {}     # permite rodar manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar lista
        run: python3 merge.py merged.txt

      - name: Publicar na branch dist
        run: |
          mkdir -p /tmp/out
          cp merged.txt /tmp/out/merged.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/merged.txt merged.txt
          git add merged.txt
          git commit -m "Lista atualizada $(date -u +%F)"
          git push --force origin dist
